research_question: How sensitive are decision probabilities to equivalent presentations?
status: implemented_requires_provider_pilots
scientific_dispatch: explicit_reviewed_0b_and_passing_native_pilots
seed: 42
sampling: uniform_without_replacement
sampling_unit: distinct_frozen_semantic_request
requests_per_dataset: 500
representations: [per_column, joint]
provider_sample: shared
baseline: fresh_replay_of_exact_frozen_request
one_factor_at_a_time: true
resample_failed_requests: false
retry_policy: repair_and_retry_same_request_preserve_attempts
studies:
  B1_replay:
    eligible: union_of_B2_B3_B4_samples
    requests_per_dataset: 500
    total_fresh_executions: 3
    additional_repeats_after_reference: 2
    response_cache: bypass
  B2_wording:
    eligible: all_nonempty_requests
    reviewed_alternatives: 3
    frozen_original_unchanged: true
  B3_field_order:
    eligible: joint_with_at_least_two_nonempty_named_fields
    requests_per_dataset: 500
    sampling_stream: independent_applicable_sample
    transformation: reverse_fields_only
  B4_option_order:
    eligible: multiclass_requests_in_wording_sample
    transformation: reverse_options_only
    align_outputs_by: original_class_identity
pairing: [dataset, frozen_bank, text_group, request_identity, model_revision]
aggregation: within_dataset_then_equal_dataset_weight
protected: [original_question, source_text_bytes, target_definition, class_meanings_and_codes,
  regression_levels_and_order, model_checkpoint_and_inference_settings]
metrics: [total_variation, signed_and_absolute_probability_change,
  argmax_flip_rate_excluding_ties, regression_mean_and_variance_change]
requires: [reviewed_three_semantically_equivalent_questions_per_dataset,
  exact_frozen_original_identity, option_alignment, native_field_order_reaches_model,
  isolated_attempt_namespace, complete_same_sample_coverage, explicit_jev_budget]
qualifying_datasets: [BIN_TEXT_FAKE_JOB_POSTING, MUL_TEXT_WINE_REVIEW, REG_TEXT_MERCARI_MARKETPLACE]
# Averaging over presentations (owner-approved 20 November 2026). Uses only responses
# already collected above: no additional model calls, no lexical rewordings.
averaging:
  additional_model_calls: false
  wording:
    averaged_pairs: [[original, paraphrase_1], [paraphrase_2, paraphrase_3]]
    single_reference: mean_distance_between_single_versions_across_the_two_pairs
    distances: [total_variation, earth_movers_distance_for_regression_levels]
  standalone_quality:
    requests: sampled_joint_requests
    comparisons:
      wording: [original, mean_of_original_and_three_paraphrases]
      option_order: [original, mean_of_original_and_reversed_realigned]
      field_order: [original, mean_of_original_and_reversed]
    labels: scoring_only
    metrics: [roc_auc_or_macro_ovr_auc, log_loss, brier, expected_calibration_error,
      spearman_expected_level_for_regression]
  calibration_bins: 10
export: results/robustness/robustness.zip
lexical_rewordings: false
