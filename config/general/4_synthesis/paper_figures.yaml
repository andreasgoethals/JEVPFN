# Planned paper figures (config/general/4_synthesis/paper_figures.yaml) -> owning notebook and saved figure stem(s). Proposed 19-11-2026.
# Placement (main | appendix | undecided) is decided later and never by folder name; nothing
# here moves a notebook, figure or result. `figures` are saved-figure stems as written by
# FigureSaver (files are `NN_<stem>.pdf` under output_JEVPFN/figures/<notebook ID>/; a trailing
# `*` matches a family of stems. `status: planned` marks figures whose notebook does not
# produce them yet. Read by src.utils.paper_figures.
schema: jevpfn.paper_figures.v1
proposed: 19-11-2026
revised: 24-11-2026
figures:
- id: fig1_headline_gain
  title: What decision models add - per-dataset gains and model ranks
  notebook: B/B1
  section: summary
  figures: [b1_gain_landscape, b1_model_ranks]
  note: The per-dataset effect is the headline view. Ranks add context about heterogeneity across extractors.
  placement: undecided
  status: planned
- id: fig2_representation_ladder_and_compute
  title: Decision features against embedding, label-trained and native alternatives, and compute
  notebook: B/B_synthesis
  figures: [b_ladder_*, b_quality_vs_compute]
  note: Select the ladder that answers the comparison in the text. Extraction time has its own request denominator.
  placement: undecided
  status: planned
- id: fig3_dataset_and_model_explanations
  title: When do decision features help - dataset moderators and decision models
  notebook: B/B4
  figures: [b4_headroom_and_properties, b4_model_diagnostics_vs_usefulness]
  note: Exploratory associations use datasets or models as indicated. Their sampling units differ.
  placement: undecided
  status: planned
- id: fig4_fields_and_prediction_in_advance
  title: Which text columns help, and predicting usefulness in advance
  notebook: B/B4
  figures: [b4_text_column_refits, b4_lodo_rule]
  note: Refitting after removing one text column measures its contribution. The rule is evaluated on held-out datasets.
  placement: undecided
  status: planned
- id: fig_primary_contrasts
  title: Paired utility against no text, frozen E5-small and supervised TAR
  notebook: general/4_synthesis
  figures: [confirmatory_family]
  placement: undecided
  status: available_when_results_exist
  note: All 21 prespecified comparisons, with the dataset-level effect and uncertainty for the recorded cohort.
- id: fig_study_at_a_glance
  title: Study at a glance - every prespecified arm against no text
  notebook: general/4_synthesis
  figures: [study_at_a_glance]
  placement: undecided
  status: available_when_results_exist
- id: c1_representations_panel
  title: Inside the decision model (Strands hidden states, Group C1)
  notebook: C/C1
  figures: [c1_position_path, c1_contrasts, c1_vector_vs_probabilities_by_dataset, c1_gains_per_column,
            c1_gains_joint]
  placement: undecided
  status: available_when_results_exist
- id: tab_rq3_adaptation
  title: Learning from labels with Strands (Group C2)
  notebook: C/C2
  kind: figure
  figures: [c2_factorial, c2_cells, c2_context, c2_datasets, c2_gains]
  placement: undecided
  status: available_when_results_exist
- id: fig_strands_ladder
  title: Strands from zero-shot probabilities to label training
  notebook: C/C_synthesis
  figures: [strands_ladder]
  placement: undecided
  status: available_when_results_exist
