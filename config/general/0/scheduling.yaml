# GPU default: B200 with a native GPFS working set and selected durable PROJECT publication.
# CPU preparation follows the selected native PROJECT filesystem. No GPU job reads its large working set from Lustre.
# Independent pools: long token audits cannot prevent ready GPU jobs from submitting.
# Queued jobs also count. Actual placement/priority remains Slurm's decision.
max_active_jobs: 64
token_audit_shards: 10
# Staging-to-release slots include queued GPU consumers, not just active transfers.
# Owner decision 20-11-2026: 8 resident workspaces within a 400 GiB working budget (was 2/200).
# The byte budget and headroom still gate every new workspace; CreditPFN shares this scratch.
max_resident_workspaces: 8
scratch_working_set_gib: 400
scratch_allocation_gib: 500
scratch_headroom_gib: 20
test_pool_limits:
  cpu: 6
  tokens: 40
  gpu: 12
  download: 2
  build: 2
  transfer: 1  # Staging and release hold the global scratch capacity lock throughout; 3 at once failed (11857458/76/88, 23-11-2026).
account: lp_verbekelab
default_gpu_profile: mindwell_b200
routes: {}
profiles:
  wice_h100:
    cluster: wice
    partition: gpu_h100
    staging_root: /lustre1/project/ALLOCATION
  mindwell_b200:
    cluster: mindwell
    partition: gpu_b200
    storage_mode: scratch_mirror
    scratch_root: /gpfs1/scratch/383/vsc38338  # VSC_SCRATCH_GPFS1 takes precedence
    durable_root: /gpfs1/project/ALLOCATION
    runtime_profile: blackwell-cu130
# Concurrent dataset allocations per decision runtime in feature creation (was a fixed 2).
# Owner request 23-11-2026: more parallel jobs. Datasets of one runtime publish to
# different stores; Slurm still decides placement.
feature_jobs_per_provider: 4
monitor_interval_seconds: 10
