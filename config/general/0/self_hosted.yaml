phase: '0'
enabled: true  # Explicit Slurm execution only; full runs also require signed acceptance.
execution_site: vsc_compute_node
providers: [liquid, liquid_lfm3, strands, perplexity, cloudflare, intern, h2o, sii, kev, decision3, nimble, glide, mammoth, drex_max, knowline, sieve]
sample: first_middle_last_rows_and_ten_longest_exact_inputs_per_dataset
max_pilot_requests: 1000
batch_size: 1  # Profile memory and timing before increasing; serialized per model.
provider_batch_sizes: {cloudflare: 2, perplexity: 2, glide: 2}  # Must pass serial/batch parity in Experiment 0.
max_recorded_failures_per_dataset: 10  # --continue-on-error remains incomplete, never accepted.
full_feature_creation_enabled: true  # All eleven frozen Experiment 0 reviews accepted on 30 October.
accepted_before_extraction_manifest: null
accepted_before_extraction_manifests:
  mammoth: 'output_JEVPFN/general/0/manifests/before_extraction/accepted_mammoth.json'
  drex_max: 'output_JEVPFN/general/0/manifests/before_extraction/accepted_drex_max.json'
  knowline: 'output_JEVPFN/general/0/manifests/before_extraction/accepted_knowline.json'
  sieve: 'output_JEVPFN/general/0/manifests/before_extraction/accepted_sieve.json'
  glide: 'output_JEVPFN/general/0/manifests/before_extraction/accepted_glide.json'
  liquid: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_liquid.json'
  liquid_lfm3: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_liquid_lfm3.json'
  strands: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_strands.json'
  perplexity: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_perplexity.json'
  cloudflare: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_cloudflare.json'
  intern: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_intern.json'
  h2o: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_h2o.json'
  sii: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_sii.json'
  kev: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_kev.json'
  decision3: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_decision3.json'
  nimble: 'output_JEVPFN/general/0/manifests/storage_migration/accepted_nimble.json'
dataset_selection:
  exclude: [REG_TEXT_ZOMATO_RESTAURANTS, MUL_TEXT_SPOTIFY_GENRES]
