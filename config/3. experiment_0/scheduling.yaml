# GPU default: B200 with a native GPFS working set and durable Lustre publication.
# CPU preparation remains on wICE. No GPU job reads its large working set from Lustre.
# Independent pools: long token audits cannot prevent ready GPU jobs from submitting.
# Queued jobs also count. Actual placement/priority remains Slurm's decision.
max_active_jobs: 64
token_audit_shards: 10
test_pool_limits:
  cpu: 6
  tokens: 40
  gpu: 12
  download: 2
  build: 2
  transfer: 2
account: lp_verbekelab
default_gpu_profile: mindwell_b200
routes: {}
profiles:
  wice_h100:
    cluster: wice
    partition: gpu_h100
    staging_root: /lustre1/project/stg_00211
  mindwell_b200:
    cluster: mindwell
    partition: gpu_b200
    storage_mode: scratch_mirror
    scratch_root: /gpfs1/scratch/383/vsc38338  # VSC_SCRATCH_GPFS1 takes precedence
    durable_root: /lustre1/project/stg_00211
    runtime_profile: blackwell-cu130
monitor_interval_seconds: 10
