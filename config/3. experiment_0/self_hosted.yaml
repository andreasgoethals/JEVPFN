phase: experiment_0
enabled: true  # Explicit Slurm execution only; full runs also require signed acceptance.
execution_site: vsc_compute_node
providers: [liquid, liquid_lfm3, strands, perplexity, cloudflare, intern, h2o, sii, kev, decision3, nimble]
sample: first_middle_last_rows_and_ten_longest_exact_inputs_per_dataset
max_pilot_requests: 1000
batch_size: 1  # Profile memory and timing before increasing; serialized per model.
provider_batch_sizes: {cloudflare: 2, perplexity: 2}  # Must pass serial/batch parity in 0A.
max_recorded_failures_per_dataset: 10  # --continue-on-error remains incomplete, never accepted.
full_feature_creation_enabled: true  # All eleven frozen 0A reviews accepted on 30 October.
accepted_before_extraction_manifest: null
accepted_before_extraction_manifests:
  liquid: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_liquid.json'
  liquid_lfm3: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_liquid_lfm3.json'
  strands: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_strands.json'
  perplexity: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_perplexity.json'
  cloudflare: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_cloudflare.json'
  intern: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_intern.json'
  h2o: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_h2o.json'
  sii: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_sii.json'
  kev: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_kev.json'
  decision3: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_decision3.json'
  nimble: 'output_JEVPFN/3. experiment_0/manifests/before_extraction/accepted_nimble.json'
dataset_selection:
  exclude: [REG_TEXT_ZOMATO_RESTAURANTS, MUL_TEXT_SPOTIFY_GENRES]
