extends: feature_creation
name: saved_decision_feature_comparison
comparison:
  providers:
  - jev
  - liquid
  - liquid_lfm3
  - perplexity
  - cloudflare
  - strands
  - intern
  - h2o
  - sii
  - kev
  - decision3
  - nimble
  representations:
  - per_column
  - joint
  artifacts: {}
  weightings:
  - rows
  - unique_inputs
  regression_agreement_tolerance: 0.5
