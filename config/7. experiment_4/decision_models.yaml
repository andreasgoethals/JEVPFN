extends: experiment_1/protocol
phase: experiment_4
name: decision_model_text_representation_comparison
enabled: false
proposal: true
extractor_catalog: extractors
candidate_extractors:
- jev
- liquid
- perplexity
- cloudflare
- strands
- microsoft
- intern
candidate_models:
- catboost
- tabpfn_3_5
- tabicl_v2
- limix_2
- kumo_tabular
- linear
model_catalog: experiment_1/models
candidate_combinations:
- non_text
- non_text_plus_joint
- non_text_plus_per_column
- non_text_plus_both
common_question_templates: src.jev.semantics
question_bank_id: null
question_variant: documented
feature_selection: provider_model_version_question_bank_and_representation
inputs: identical_task_metadata_and_text_only
missing_policy: skip_empty_store_nan
feature_view: main
new_extraction_requires:
- approved_local_pilot
- verified_revision
- reviewed_common_input_coverage
- approved_budget
context_mismatch: report_coverage_and_review_never_silent_provider_truncation
long_text_policy: unresolved
refusal_policy: unresolved_never_treat_as_missing_text
comparison: paired_feature_benefit_within_fixed_predictor
record:
- prediction_metrics
- extraction_input_tokens
- extraction_cost
- extraction_latency
- throughput
- downstream_fit_time
- downstream_predict_time
- failure_coverage
dataset_selection:
  exclude:
  - REG_TEXT_ZOMATO_RESTAURANTS
  - MUL_TEXT_SPOTIFY_GENRES
comparison_implemented_in: experiment_1/main
new_model_fits_required: false
