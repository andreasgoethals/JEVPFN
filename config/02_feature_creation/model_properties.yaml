# Decision-model properties: one sourced row per provider in extractors.yaml.
# Every field is {value, verified, source}; value null + verified false means not
# verifiable from local sources (never guessed). Interpretation aid only: these
# covariates never select providers, features or predictors.
schema: jevpfn.model_properties.v1
checked_on: '2026-11-19'
architecture_families:
  decoder_pointer_head: Decoder language model with a separate pointer/decision head over option positions
  decoder_lm_head: Decoder language model read out through LM-head logits of label tokens
  bidirectional_encoder: Bidirectional (encoder or non-causal) backbone with a decision readout
  other: Recurrent, diffusion, hybrid or otherwise non-standard backbone
  undisclosed: Hosted model whose architecture is not disclosed
readout_types:
  pointer_head: Learned head scoring option/candidate positions
  lm_label_tokens: Softmax over LM-head logits of option label tokens
  linear_readout: Learned linear/classifier head on pooled hidden states
  api: Probabilities returned by a hosted API
