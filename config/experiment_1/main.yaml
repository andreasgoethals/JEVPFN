extends: experiment_1/protocol
phase: experiment_1
name: jev_feature_comparison
enabled: false
proposal: true
model_catalog: experiment_1/models
candidate_models: [tabpfn_3_5, tabpfn_3, catboost, linear]
roster_note: focused_four_model_proposal_no_model_ranking_campaign
deferred_models: [tabicl_v2, limix_2, causilo, exaone_tabular, tabdpt_1_3, mitra_v2]
feature_artifacts: []
feature_selector:
  provider: jev
  model: jev-1.13.0
  version: 1.13.0
  question_bank_id: null  # Replace with the reviewed saved bank before running.
  question_variant: documented
candidate_combinations: [non_text, non_text_plus_text_statistics, non_text_plus_per_column, non_text_plus_joint, non_text_plus_both]
text_statistics_baseline: src.evaluation.features.text_statistics
include_non_text_features_in_jev: false
feature_view:
  binary_classification: positive_class_probability
  multiclass_classification: full_class_probability_vector
  regression: expected_direction
deduplicate_identical_feature_views: true  # Single-text datasets need no duplicate arms/fits.
requires: [accepted_experiment_0, complete_feature_artifacts, agreed_evaluation_protocol]

dataset_selection:
  exclude: [REG_TEXT_ZOMATO_RESTAURANTS, MUL_TEXT_SPOTIFY_GENRES]
