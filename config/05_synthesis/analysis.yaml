# Select headline metrics/contrasts before viewing comparative evaluation outcomes.
# The available test is not an automatic assertion that the dataset sample is random.
# Owner approval in chat on 24-11-2026 ("you can ungate everything"); verified before any
# comparative result export existed locally (no B1-B5 or C1-C2 export; the A1 ZIP is a
# superseded-schema RQ1A output description, not a predictor comparison).
approved_before_results: true
reviewed_by: Andreas Goethals (owner approval in chat, 24-11-2026; recorded by Claude)
unit: per_dataset_mean_of_five_paired_outer_fold_differences
fold_sd: descriptive_only
test: two_sided_wilcoxon_signed_rank
correction: holm_across_all_predeclared_contrasts
# The confirmatory family (Holm over all 21): the proposal's three primary contrasts, each per
# predictor (7), on the pooled headroom-normalised gain of all 18 datasets, run by
# `inference.pooled_confirmatory_tests` on `learner_scores.pooled_scores`. Decision features are
# the median over all 17 models of the both view (the view every other B/C comparison uses);
# the frozen and TAR references are the prespecified matched recipes (E5-small, per-column
# PCA32; the decision + embedding arm and the B synthesis main arms use the same). Per-column
# and joint views, other encoders and the label-trained classifier stay descriptive.
# The 18 benchmark datasets (selection order); every pooled contrast uses all of them.
confirmatory_datasets: &all_18_datasets
- BIN_TEXT_FAKE_JOB_POSTING
- BIN_TEXT_JIGSAW_TOXICITY
- BIN_TEXT_KICKSTARTER_FUNDING
- MUL_TEXT_DATA_SCIENTIST_SALARY
- MUL_TEXT_MICHELIN_RESTAURANTS
- MUL_TEXT_PRODUCT_SENTIMENT
- MUL_TEXT_US_ACCIDENTS
- MUL_TEXT_WINE_REVIEW
- MUL_TEXT_WOMEN_CLOTHING_REVIEW
- REG_TEXT_BABIES_PRICES
- REG_TEXT_BOOK_PRICE
- REG_TEXT_BOOK_READABILITY
- REG_TEXT_MERCARI_MARKETPLACE
- REG_TEXT_MONTGOMERY_SALARIES
- REG_TEXT_ROTTEN_TOMATOES
- REG_TEXT_SCIMAGOJR_IMPACT
- REG_TEXT_VANCOUVER_SALARIES
- REG_TEXT_VIDEO_GAMES_SALES
contrasts:
# decision_features_vs_non_text: decision/both/median vs baseline, per predictor
- {type: pooled_normalised_gain, application: B1_decision_features, group: catboost, learner: decision/both/median, versus: baseline, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B1_decision_features, group: tabpfn_3_5, learner: decision/both/median, versus: baseline, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B1_decision_features, group: tabicl_v2, learner: decision/both/median, versus: baseline, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B1_decision_features, group: limix_2, learner: decision/both/median, versus: baseline, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B1_decision_features, group: kumo_tabular, learner: decision/both/median, versus: baseline, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B1_decision_features, group: linear, learner: decision/both/median, versus: baseline, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B1_decision_features, group: lightgbm, learner: decision/both/median, versus: baseline, direction: 1,
   datasets: *all_18_datasets}
# decision_features_vs_frozen_embeddings: decision/both/median vs frozen/e5_small_v2/per_column32, per predictor
- {type: pooled_normalised_gain, application: B2_representations, group: catboost, learner: decision/both/median, versus: frozen/e5_small_v2/per_column32, direction: 1,
   datasets: *all_18_datasets}
