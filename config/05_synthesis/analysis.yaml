undefined_or_incomplete: stop_inferential_analysis_and_report_missing_results
native_text_baselines: descriptive_original_text_system_references
pretraining_overlap: unknown_unless_documented_evidence_establishes_otherwise
# Proposal of 18 November 2026, approved by the owner on 24-11-2026; its primary contrasts are
# declared in `contrasts` above (the confirmatory runner reads only `contrasts`). Pooled contrasts
# over all 18 datasets use `type: pooled_normalised_gain` or `pooled_proper_score_skill` with
# application, group, learner, versus, datasets and direction; they run only through
# `inference.pooled_confirmatory_tests` (Holm over every declared contrast), on scores from
# `src/evaluation/learner_scores.py` (`run_confirmatory_family`).
proposal:
  status: approved
  headline_estimand: headroom_normalised_gain_over_same_predictor_non_text
  headline_metric: {binary: roc_auc, multiclass: roc_auc_ovr_macro, regression: r2}
  aggregation: equal_dataset_weight_all_18_datasets
  summaries: [mean, median]  # owner 23-11-2026: median next to the mean, both with dataset-bootstrap CIs
  uncertainty: percentile_bootstrap_over_datasets
  primary_contrasts:
  - decision_features_vs_non_text
  - decision_features_vs_frozen_embeddings
  - decision_features_vs_tar
  contrast_scope: each_predictor_separately_median_over_decision_models
  decision_modes_reported: [per_column, joint, both]
  ranking_stability: kendall_tau_b_between_predictors
  task_types: descriptive_only_never_separate_inference
  when_text_helps_axes: [availability, length, novelty, baseline_entropy, prediction_shift, field_type]
# Statistical framework (23-11-2026), implemented in src/evaluation/inference.py
# (`compare_learners`, `confirmatory_tests`) and src/evaluation/fold_wins.py (`fold_win_rate`,
# `pama`). Sources: Demsar 2006; Iman & Davenport 1980; Holm 1979; Wilcoxon 1945; Friedman 1937;
# Nemenyi 1963; Benavoli et al. 2014, 2017; Gneiting & Raftery 2007; Fernandez-Delgado et al. 2014.
# Owner decision 23-11-2026: no Finner or Shaffer corrections and no mean-rank z post-hoc
# p-values; Holm is the only multiplicity correction. Fold-level win rates and PAMA count the
# (dataset, outer fold) cells (18 x 5 = 90) but are descriptive: folds of one dataset share data,
# so their 95% intervals resample whole datasets (cluster bootstrap), never single folds.
# Always all 18 datasets as the units; folds only form each dataset's mean. Only 9 are
# classification and 9 regression, so a test over all 18 needs one dimensionless score
# shared by both tasks (Demsar 2006: differences must be commensurable). Task-specific
# metrics (AUC, R^2, log loss, RPS) have N = 9 and are descriptive: with N = 9 the
# smallest exact two-sided Wilcoxon p is 2/2^9 = 0.0039, which Holm over 13+ contrasts
# can never bring below 0.05.
# Approved by the owner on 24-11-2026 together with the contrasts above.
# Descriptive companion (not inference): the MulTaBench-style normalised score
# (`group_b.normalized_scores`, Arazi et al. 2026) pools AUC and R^2 on one 0-1 scale by
# per-dataset min-max over the compared configurations; it is relative to that set and shown
# next to, never instead of, the per-task-family views.
framework:
  status: approved
  unit: per_dataset_mean_of_five_outer_folds_all_18_datasets
  confirmatory_scores: {B: headroom_normalised_gain, A2: proper_score_skill}  # both tasks, N = 18
  omnibus_several_learners: friedman_with_iman_davenport_f_tie_corrected
  ranks_and_cd_diagram: descriptive_nemenyi_critical_difference
  confirmatory_pairwise: two_sided_wilcoxon_signed_rank_on_dataset_differences
  family_correction: holm_across_all_confirmatory_contrasts  # one family, as `correction` above
  omnibus_gate: none  # Holm controls the family itself; a Friedman gate is not required
  bayesian: {test: bayesian_signed_rank_dirichlet_process, prior_strength: 0.5, decision: largest_posterior_region}
  rope: {headroom_normalised_gain: 0.01, proper_score_skill: 0.01, roc_auc: 0.01, roc_auc_ovr_macro: 0.01, r2: 0.01, log_loss: 0.01}  # log_loss: A1, descriptive
  mean_rank_post_hoc: not_reported  # mean ranks only in the descriptive CD diagram (Benavoli et al. 2016)
  win_rate: fold_level_with_dataset_cluster_bootstrap_ci  # wins/ties/losses vs reference; complete cells only, excluded counted
  pama: fold_level  # Fernandez-Delgado et al. 2014; ties at the top credit each tied learner; dataset-cluster bootstrap CI
  population: the_18_benchmark_datasets_not_a_random_sample_of_all_tabular_text_tasks
  application:
    A1_outputs: {comparison: 17_decision_models, procedure: friedman_ranks_cd_diagram, metric: log_loss_joint_requests, inference: descriptive}
    A2_stability: {comparison: averaged_presentations_vs_canonical_per_model, procedure: wilcoxon_holm_over_17_models_plus_bayesian, metric: proper_score_skill, descriptive_metrics: [log_loss, ranked_probability_score, brier, roc_auc], inference: confirmatory}
    A3_geometry: {inference: descriptive_only}
    B1_decision_features: {comparison: decision_modes_vs_non_text_control_per_predictor, procedure: wilcoxon_holm_plus_bayesian, ranking: friedman_cd_over_arms, inference: confirmatory}
    B2_representations: {comparison: decision_vs_frozen_embeddings_tar_label_classifier, procedure: wilcoxon_holm_plus_bayesian, inference: confirmatory}
    B3_when_text_helps: {comparison: three_lodo_rules_vs_always_and_never, procedure: wilcoxon_on_regret_plus_bayesian, inference: exploratory}
    B4_data_efficiency: {comparison: arms_vs_baseline_per_size, procedure: wilcoxon_holm_vs_control, inference: exploratory}
    B5_native_text_systems: {comparison: native_text_systems, procedure: friedman_cd_diagram, inference: descriptive}
    C1_strands_states: {comparison: 14_arms_vs_non_text_control, procedure: friedman_then_wilcoxon_holm_vs_control, inference: exploratory}
    C2_strands_adaptation: {comparison: 2x2_zero_shot_head_lora_both, procedure: friedman_then_all_pairwise_wilcoxon_holm, inference: exploratory}
