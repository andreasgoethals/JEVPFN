   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B2_representations, group: kumo_tabular, learner: decision/both/median, versus: tar/e5_small_v2_tar/per_column32, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B2_representations, group: linear, learner: decision/both/median, versus: tar/e5_small_v2_tar/per_column32, direction: 1,
   datasets: *all_18_datasets}
- {type: pooled_normalised_gain, application: B2_representations, group: lightgbm, learner: decision/both/median, versus: tar/e5_small_v2_tar/per_column32, direction: 1,
