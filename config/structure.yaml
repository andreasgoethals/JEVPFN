# Physical and human-facing layout of config/, notebooks/ and output_JEVPFN/.
# Schema v4, owner-approved 26 November 2026: every experiment has exactly ONE name, used
# literally as its phase ID, config file, output folder and notebook name. Four top-level
# groups, in study order: general -> A -> B -> C.
#
#   general  0 (qualification before feature creation) -> 1_data_and_questions ->
#            2_feature_creation -> 3_study_audit -> 4_synthesis
#   A        A0 (gate) -> A1 outputs -> A2 robustness -> A3 geometry -> A_synthesis
#   B        B0 (gate) -> B1 decision features -> B2 frozen embeddings -> B3 TAR and
#            label-trained classifiers -> B4 when decision features help -> B5 amount of
#            labelled data -> B6 native-text systems -> B_synthesis
#   C        C0 (gate) -> C1 Strands hidden states -> C2 learning from labels -> C_synthesis
#
# Each entry: output `output_JEVPFN/<group>/<folder>/{logs,manifests,results}/`, notebook
# `notebooks/<group>/<folder>.ipynb` (ID `<group>/<folder>`), figures
# `output_JEVPFN/figures/<group>/<folder>/`. A general stage keeps its config files in
# `config/general/<folder>/` (listed under `configs`); an experiment or gate has ONE config
# file, `config/<group>/<folder>.yaml` (`config: true`), whose optional `sections:` hold
# further named configurations (`B1/models`). The phase ID equals the entry ID, except the
# general preparation stages, whose descriptive phase IDs are listed under `phases`.
# `nested` gives a retired phase a sub-folder of its home (B1/regression_readout).
# `notebook_only: true` marks an entry that owns only a notebook and its records.
#
# Earlier layouts (v1-v3) and identifiers are mapped ONCE, in the checksummed
# `layout_aliases.yaml` named below; nothing else in the code knows an old name.
# Paper placement is decided separately under `paper:` and never encoded in a folder.
schema: jevpfn.structure.v4
approved: 26-11-2026
aliases: {file: layout_aliases.yaml, sha256: 7e6430629d3ebc5a380058b44a801f9c61e6edc81f61d8d6a64b190903b748a7}
groups: [general, A, B, C]
notebook_groups: [general, A, B, C, paper]
entries:
# -- general ---------------------------------------------------------------------------
- id: '0'
  group: general
  folder: '0'
  title: '0: qualification before feature creation'
  phases: ['0']
  notebook: {phase: '0'}
  configs: [control_runtime, debug, gpu_contracts, jev_prefix_pilot, jev_smoke, scheduling,
            self_hosted]
- id: data
  group: general
  folder: 1_data_and_questions
  title: Data and questions
  phases: [question_preparation, exploration]
  notebook: {phase: exploration}
  configs: [audit, datasets, dataset_semantics, question_design, question_preparation]
- id: feature_creation
  group: general
  folder: 2_feature_creation
  title: Feature creation
  phases: [feature_creation]
  notebook: {phase: feature_creation}
  configs: [feature_creation, approved_additions, decision_pilot, embedding_models,
            extractors, feature_comparison, model_properties, text_embeddings]
- id: study_audit
  group: general
  folder: 3_study_audit
  title: Study audit
  notebook_only: true
  notebook: {phase: synthesis}
- id: synthesis
  group: general
  folder: 4_synthesis
  title: Cross-experiment synthesis and paper figures
  phases: [synthesis]
  notebook: {phase: synthesis}
  configs: [analysis, paper_figures]
# -- Group A: how do decision models behave? -------------------------------------------
- id: A0
  group: A
  folder: A0
  title: 'A0: Group A qualification (replay, presentation and geometry pilots)'
  phases: [A0]
  notebook: {phase: A0}
  config: true
- id: A1
  group: A
  folder: A1
  title: 'A1: decision outputs and context'
  phases: [A1]
  notebook: {phase: A1}
- id: A2
  group: A
  folder: A2
  title: 'A2: controlled presentation robustness'
  phases: [A2]
  notebook: {phase: A2}
  config: true
  data_files: [A2_question_versions.csv]
- id: A3
  group: A
  folder: A3
  title: 'A3: decision and encoder geometry'
  phases: [A3]
  notebook: {phase: A3}
  config: true
- id: A_synthesis
  group: A
  folder: A_synthesis
  title: Group A synthesis
  notebook_only: true
  notebook: {phase: A1}
# -- Group B: when do decision features improve tabular prediction? --------------------
- id: B0
  group: B
  folder: B0
  title: 'B0: Group B qualification (predictor contracts and full-fold profiles)'
  phases: [B0]
  notebook: {phase: B0}
  config: true
- id: B1
  group: B
  folder: B1
  title: 'B1: decision features in fixed predictors'
  phases: [B1]
  nested: {regression_readout: regression_readout}
  notebook: {phase: B1}
  config: true
- id: B2
  group: B
  folder: B2
  title: 'B2: frozen text embeddings and decision + embedding combinations'
  phases: [B2]
  notebook: {phase: B2}
  config: true
- id: B3
  group: B
  folder: B3
  title: 'B3: label-trained alternatives (TAR and label-trained classifiers)'
  phases: [B3]
  notebook: {phase: B3}
  config: true
- id: B4
  group: B
  folder: B4
  title: 'B4: when decision features help'
  phases: [B4]
  notebook: {phase: B4}
  config: true
- id: B5
  group: B
  folder: B5
  title: 'B5: amount of labelled data (training-size curves)'
  phases: [B5]
  notebook: {phase: B5}
  config: true
- id: B6
  group: B
  folder: B6
  title: 'B6: native-text systems'
  phases: [B6]
  notebook: {phase: B6}
  config: true
- id: B_synthesis
  group: B
  folder: B_synthesis
  title: Group B synthesis
  notebook_only: true
  notebook: {phase: B4}
# -- Group C: Strands from the inside and from labels ----------------------------------
- id: C0
  group: C
  folder: C0
  title: 'C0: Strands training qualification'
  phases: [C0]
  notebook: {phase: C0}
  config: true
- id: C1
  group: C
  folder: C1
  title: 'C1: inside the decision model (Strands hidden states, label-free)'
  phases: [C1]
  notebook: {phase: C1}
  config: true
- id: C2
  group: C
  folder: C2
  title: 'C2: learning from labels (Strands head-only, LoRA, LoRA + head)'
  phases: [C2]
  notebook: {phase: C2}
  config: true
- id: C_synthesis
  group: C
  folder: C_synthesis
  title: Group C synthesis
  notebook_only: true
  notebook: {phase: C2}

# Paper placement: main | appendix | undecided. Decided later, never by folder name.
paper:
  '0': {placement: undecided}
  data: {placement: undecided}
  feature_creation: {placement: undecided}
  study_audit: {placement: undecided}
  synthesis: {placement: undecided}
  A0: {placement: undecided}
  A1: {placement: undecided}
  A2: {placement: undecided}
  A3: {placement: undecided}
  A_synthesis: {placement: undecided}
  B0: {placement: undecided}
  B1: {placement: undecided}
  B2: {placement: undecided}
  B3: {placement: undecided}
