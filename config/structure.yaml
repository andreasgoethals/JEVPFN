# Physical and human-facing layout of config/, notebooks/ and output_JEVPFN/.
# Numbering approved by the owner on 18 November 2026; revised 19 November 2026 (one flat
# notebook per folder; supervised adaptation renumbered Exp 10, Exp 9 reserved) and
# 20 November 2026 (Group B adds exp11_data_efficiency, internal phase data_efficiency;
# Group C activates the reserved Exp 9 as exp09_representations, internal phase
# representations, and replaces the Exp 10 adaptation design).
#
# Folder names only. Internal phase IDs (exploration, question_preparation,
# feature_creation, experiment_0..4, synthesis, rq1..rq3, regression_readout) remain the
# keys of hashes, recipes, receipts and manifests and are never renamed here.
# Each internal phase has one home folder (`phases`, the first listed phase owns the
# folder's output tree); `routes` send named sub-trees of a phase to another folder.
# `nested` gives a retired phase a sub-folder of its home. Each folder has at most one
# notebook, `notebooks/<folder>.ipynb`, whose ID is the folder name; `legacy` lists previous
# notebook IDs (aliases whose records move to the folder) and `merged` lists previous IDs
# combined into this notebook (aliases whose records are archived, since several cannot
# share one record folder). `previous_folders` are earlier names of the same folder.
# `planned` reserves an experiment number without creating any folder.
# Output: each folder holds its own {logs,manifests,results}/ and its notebook's records in
# `<kind>/notebook/`. Figures share ONE folder, output_JEVPFN/figures/<notebook>/ (PDFs,
# _figures.json; grouping in src.utils.structure.figure_group) with figures/CAPTIONS.md, and
# output_JEVPFN/All_Results.md is the one report. Previous-layout records go to archive/.
# Paper placement is decided separately under `paper:` and never encoded in a folder.
schema: jevpfn.structure.v2
approved: 18-11-2026
revised: 19-11-2026
entries:
- id: data
  folder: 00_data
  title: Data exploration and question preparation
  phases: [question_preparation, exploration]
  notebook: {phase: exploration, legacy: [general/01_data, 00_data/data]}
  configs: [audit, datasets, dataset_semantics, question_design, question_preparation]
- id: exp0a
  folder: 01_exp0a
  title: Experiment 0A, qualification before feature creation
  phases: [experiment_0]
  configs: [control_runtime, debug, gpu_contracts, jev_prefix_pilot, jev_smoke,
            research_questions, scheduling, self_hosted]
- id: feature_creation
  folder: 02_feature_creation
  title: Feature creation
  phases: [feature_creation]
  notebook: {phase: feature_creation, legacy: [general/02_features, 02_feature_creation/features]}
  configs: [feature_creation, approved_additions, decision_pilot, embedding_models,
            extractors, feature_comparison, model_properties, text_embeddings]
- id: exp0b
  folder: 03_exp0b
  title: Experiment 0B, qualification after feature creation
  routes:
    experiment_0: [manifests/after_extraction, logs/after_extraction, manifests/reports.json]
  notebook: {phase: experiment_0, legacy: [general/03_validation, 03_exp0b/validation]}
- id: exp01
  folder: exp01_outputs
  title: Decision outputs and context
  phases: [rq1]
  routes:
    rq1: [results/outputs]
  notebook: {phase: rq1, legacy: [rq1/01_outputs, exp01_outputs/outputs]}
- id: exp02
  folder: exp02_robustness
  title: Controlled presentation robustness
  routes:
    rq1: [results/robustness, results/hosted_ledgers]
  notebook: {phase: rq1, legacy: [rq1/02_robustness, exp02_robustness/robustness]}
  configs: [behavior, question_versions.csv]
- id: exp03
  folder: exp03_geometry
  title: Decision and encoder geometry
  routes:
    rq1: [results/geometry, results/geometry_pilots]
  notebook: {phase: rq1, legacy: [rq1/03_geometry, exp03_geometry/geometry]}
  configs: [geometry]
- id: exp04
  folder: exp04_decision_features
  title: Decision features in fixed predictors
  phases: [experiment_1]
  nested: {regression_readout: regression_readout}
  notebook: {phase: experiment_1, legacy: [rq2/01_decisions, exp04_decision_features/decisions]}
  configs: [main, models, protocol]
- id: exp05
  folder: exp05_frozen_embeddings
  title: Frozen text embeddings
  phases: [experiment_2]
  notebook: {phase: experiment_2, legacy: [rq2/02_embeddings, exp05_frozen_embeddings/embeddings]}
  configs: [embeddings]
- id: exp06
  folder: exp06_tar
  title: Target-aware embeddings (TAR)
  phases: [experiment_3]
  notebook: {phase: experiment_3, legacy: [rq2/03_tar, exp06_tar/tar]}
  configs: [tar]
- id: exp07
  folder: exp07_native_text
  title: Native-text systems
  phases: [experiment_4]
  notebook: {phase: experiment_4, legacy: [rq2/04_native, exp07_native_text/native]}
  configs: [native_text]
- id: exp08
  folder: exp08_when_text_helps
  title: When decision features help
  phases: [rq2]
  notebook: {phase: rq2, legacy: [rq2/05_when_text_helps, exp08_when_text_helps/when_text_helps]}
  configs: [when_text_helps, text_column_refits]
- id: exp09
  folder: exp09_representations
  title: Inside the decision model (Strands hidden states, label-free)
  phases: [representations]
  notebook: {phase: representations}
  configs: [representations]
- id: exp10
  folder: exp10_adaptation
  previous_folders: [exp09_adaptation]
  title: Learning from labels (Strands head-only, LoRA, LoRA + head)
  phases: [rq3]
  notebook:
    phase: rq3
    merged: [exp09_adaptation/01_calibration, exp09_adaptation/02_head, exp09_adaptation/03_lora,
             exp09_adaptation/04_full, rq3/01_calibration, rq3/02_head, rq3/03_lora, rq3/04_full]
  configs: [adaptation]
- id: exp11
  folder: exp11_data_efficiency
  title: Amount of labelled data (training-size curves)
  phases: [data_efficiency]
  notebook: {phase: data_efficiency}
  configs: [data_efficiency]
- id: synthesis
  folder: synthesis
  title: Cross-experiment synthesis and paper figures
  phases: [synthesis]
  configs: [analysis, paper_figures]

# Reserved experiment numbers: documented, never given a folder until implemented.
# Exp 9 (exp09_representations) was reserved on 19 November 2026 and activated by Group C on
# 20 November 2026; no number is reserved now.
planned: []

# Paper placement: main | appendix | undecided. Decided later, never by folder name.
paper:
  data: {placement: undecided}
  exp0a: {placement: undecided}
  feature_creation: {placement: undecided}
  exp0b: {placement: undecided}
  exp01: {placement: undecided}
  exp02: {placement: undecided}
  exp03: {placement: undecided}
  exp04: {placement: undecided}
  exp05: {placement: undecided}
  exp06: {placement: undecided}
  exp07: {placement: undecided}
  exp08: {placement: undecided}
  exp09: {placement: undecided}
  exp10: {placement: undecided}
  exp11: {placement: undecided}
  synthesis: {placement: undecided}
