# Group C, C2 (owner-approved 20 November 2026): learning from labels, a 2 x 2 design.
# Replaces the earlier calibration / head / LoRA / full-backbone plan. Strands only, JOINT
# question only, probability features only. Empty text stays missing (no request), as in B1.
research_question: Does training Strands on the dataset's labels improve its decision features?
status: design_approved_runner_implemented_requires_b200_pilot
extends: experiment_1/main
phase: rq3
name: strands_adaptation
enabled: false
experiment_0_acceptance: null
training_enabled: false
provider: strands
model: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
question: joint
# torso x head: zero-shot is B1 Strands joint (no new run).
cells:
  zero_shot: {torso: released, head: released, run: reuse_b1_strands_joint}
  head_only: {torso: frozen, head: trained, run: cached_c1_vectors}
  lora_only: {torso: lora_trained, head: frozen_released, run: b200}
  lora_head: {torso: lora_trained, head: trained, run: b200}
trained_cells: [head_only, lora_only, lora_head]
# Targets: the true class; regression -> nine equal-frequency bins of the fit's training rows,
# mapped lowest-first to Strands' nine ordered levels (-4 ... +4 evidence).
regression_bins: 9
# Cross-fitting inside every outer training fold: unstratified, label-independent parts.
crossfit:
  parts: 3
  seed: 20261120
  assignment: sha256_of_seed_dataset_split_fold_row_then_rank
  test_rows: mean_of_the_three_fits
early_stopping:
  validation_fraction: 0.10
  validation_cap: 1000
  max_epochs: 3
  criterion: validation_loss_per_epoch_keep_best
  patience_epochs: 0
binary_threshold_policy: fixed_0_5
# Strands' own published recipe, every value with its source line in the pinned read-only
# snapshot dm-library/repositories/StrandsDecider.txt (configs/v1/strands-decider-2B-qwen3.5-v1-2610.yaml,
# training/train.py, training/data/collate.py, src/strands_decider/modeling.py).
recipe:
  lora_r: {value: 16, source: 6213, note: per soup member; the released soup is continued as published}
  lora_alpha: {value: 32, source: 6214, note: alpha / r = 2 is kept by the soup}
  lora_targets:
    value: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj, in_proj_qkv, in_proj_z,
            in_proj_a, in_proj_b, out_proj]
    source: 6217
  lora_dropout: {value: 0.05, source: 29864}
  lr: {value: 0.0001, source: 6224, applies_to: lora}
  head_lr: {value: 0.001, source: 6225, applies_to: head}
  weight_decay: {value: 0.01, source: 6226, applies_to: head matrices; LoRA group 0.0 (52454)}
  adam_betas: {value: [0.9, 0.95], source: 52242}
  warmup_ratio: {value: 0.03, source: 6227}
  schedule: {value: linear_warmup_then_cosine_to_zero, source: 52516, lr_floor_source: 52248}
  max_grad_norm: {value: 1.0, source: 6228}
  micro_batch_size: {value: 8, source: 6222}
  grad_accum: {value: 4, source: 6223}
  head_dropout: {value: 0.05, source: 6209}
  shuffle_options: {value: true, source: 6231, note: choice/noul permuted; score reversed with p 0.5}
  reverse_score_prob: {value: 0.5, source: 6235}
  ordinal_smoothing: {value: 0.1, source: 6234, applies_to: score}
  gradient_checkpointing: {value: false, source: 6229}
  bf16_autocast: {value: false, source: 52184}
  cudnn_sdp: {value: false, source: 52673}
  temperature: {value: 1.0, source: 52401, note: init_from resets fitted temperatures}
  seed: {value: 0, source: 6238}
  # Not used (outside the approved design): the KL anchor to v19 (6204) and the teacher file.
pilot:
  dataset: smallest_selected_dataset
  fold: 0
  part: 0
  cell: lora_head
