# B4: how much labelled data? Owner-approved Group B design (20 November 2026).
# This study DELIBERATELY subsamples outer-training rows. It is an explicit, recorded design
# (sizes, draws and row identities enter every split identity), not a silent cap: test rows,
# classes, columns and features are never dropped. The full-data result is B1/B2 itself.
extends: B1
phase: B5
name: data_efficiency_curves
enabled: false
gate_acceptance: null
training_sizes: [128, 256, 512, 1024, 2048, 4096, 8192, 16384]
# Independent nested draws per outer fold: subsets of one draw are nested across sizes.
draws:
  - {max_size: 512, draws: 5}
  - {max_size: 2048, draws: 3}
  - {max_size: 16384, draws: 1}
sampling: stratified_nested_at_least_one_per_class_regression_uniform
sampling_seed: 20261120
curves:
  main:
    datasets: all_selected
    sizes: [128, 256, 512, 1024, 2048]
  extended:
    # Membership is checked against the actual outer-training sizes (>= 16,384 in every fold).
    min_training_rows: 16384
    datasets:
    - BIN_TEXT_JIGSAW_TOXICITY
    - MUL_TEXT_US_ACCIDENTS
    - REG_TEXT_MERCARI_MARKETPLACE
    - BIN_TEXT_KICKSTARTER_FUNDING
    - MUL_TEXT_WINE_REVIEW
    - REG_TEXT_VANCOUVER_SALARIES
    - REG_TEXT_SCIMAGOJR_IMPACT
    sizes: [128, 256, 512, 1024, 2048, 4096, 8192, 16384]
# Arms (all seven predictors): baseline; each decision model's "both" view; frozen embeddings
# with per-text-column PCA32 (the per-column view is used for B4); the label-trained classifier
# on E5-small-v2, per-text-column view. PCA and classifier fit only on the sampled rows.
arms:
  decision_feature_set: non_text_plus_both
  encoders: [e5_small_v2, e5_large_v2, qwen3_embedding_0_6b]
  pca: {scope: per_column, components: 32}
  probe: {encoder: e5_small_v2, view: per_column}
# AUC/R2 are threshold-free; inner threshold folds are not refitted on small samples.
binary_threshold_policy: fixed_0_5
analysis:
  outcome: headline_metric_gain_over_same_size_baseline
  x: log2_training_size
  combine: dersimonian_laird_random_effects_over_datasets_per_size
  report: [raw_gain, share_of_headroom]
