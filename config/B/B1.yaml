    - all_selected_task_and_class_limits_up_to_30_classes
    - missing_value_and_categorical_handling
    - training_data_overlap_check_for_models_pretrained_on_real_tables
    - matching_row_splits_and_declared_compute_budgets
    - offline_vsc_import_and_tiny_model_smoke_after_approval
    live_runtime_verified: false
    adapter_module: src.evaluation.models
    campaign_module: src.evaluation.campaign
  protocol:
    # Injectable evaluation runner exists; model/checkpoint selection and execution remain disabled.
    enabled: false
    proposal: true
    random_seed: 20260929
    evaluation:
      outer_folds: 5  # Owner requested five-fold CV; repeated CV was not requested.
      repeats: 1
      identical_splits_across_models_and_features: true
      split_manifest: null  # Generate once from row IDs and the pinned dataset version.
      classification_split: stratified_kfold  # Binary AND multiclass.
      regression_split: kfold
      shuffle: true
      group_or_time_policy: not_used_in_this_benchmark  # Owner decision, not a deployment claim.
      training_rows: all_outer_training_rows
      training_row_cap: null
      silent_subsampling: forbidden
      unsupported_full_training_set: record_resource_limit_and_review_never_silently_cap
      inner_validation:
        source: outer_training_only
        strategy: stratified_out_of_fold
        folds: 3
        shuffle: true
        applies_to: binary_threshold_selection_only
        preprocessing_fit_scope: each_inner_training_partition
      binary:
        primary_metric: roc_auc
        threshold_objective: f1
        threshold_source: inner_validation_predictions_only
        experiment_3_threshold_policy: fixed_0_5_no_inner_encoder_refits
        test_threshold_tuning: forbidden
        positive_class: canonical_last  # Same fixed class orientation as Jev templates.
        tie_break_proposal: closest_to_0_5_then_larger_threshold
        refit_after_threshold_selection: true  # Refit on the full outer training fold; freeze threshold.
        record_probability_metrics: [roc_auc, average_precision, pr_auc_trapezoidal, log_loss, brier, ece, maximum_calibration_error]
        record_decision_metrics: [f1, precision, recall, specificity, negative_predictive_value, accuracy, balanced_accuracy, f1_macro, f1_micro, f1_weighted, precision_macro, precision_micro, precision_weighted, recall_macro, recall_micro, recall_weighted, mcc, cohen_kappa]
        record_thresholds: [default_0_5, validation_selected]
        record_confusion_matrix_and_per_class_scores: true
      multiclass:
        primary_metric: roc_auc_ovr_macro
        decision_rule_proposal: argmax
        per_class_threshold_tuning: false  # Needs a separate design if later requested.
        secondary_metrics_proposal: [log_loss, accuracy, roc_auc_ovr_macro]
        record_probability_metrics: [log_loss, brier_multiclass_sum, roc_auc_ovr_macro, roc_auc_ovr_weighted, roc_auc_ovo_macro, roc_auc_ovo_weighted, average_precision_macro, average_precision_micro, average_precision_weighted, ece, maximum_calibration_error]
        record_decision_metrics: [accuracy, balanced_accuracy, f1_macro, f1_micro, f1_weighted, precision_macro, precision_micro, precision_weighted, recall_macro, recall_micro, recall_weighted, mcc, cohen_kappa]
        record_top_k_accuracy: [2, 3, 5]  # Null when k >= number of classes (trivial metric).
        record_confusion_matrix_and_per_class_scores: true
        probability_columns: fixed_class_vocabulary_aligned_across_folds
        rare_classes: review_split_feasibility_never_silently_merge_or_drop
      regression:
        primary_metric: r2
        secondary_metrics_proposal: [mae, r2]
        candidate_metrics: [rmse, mae, r2]
        classification_threshold: not_applicable
        record_point_metrics: [rmse, mse, mae, median_absolute_error, max_absolute_error, r2, explained_variance, mean_error, pearson_r, spearman_rho]
        conditional_metrics: [mape_pct, rmsle]  # Require explicitly declared meaningful ratio scale.
        optional_quantile_metrics: [pinball_loss, observed_fraction_below, interval_coverage, mean_interval_width, interval_score]
        unsupported_distribution_metrics: [crps, negative_log_likelihood]  # No common distribution contract yet; never fabricate from point predictions.
        target_scale: declared_per_dataset_no_automatic_inverse_transform
      metric_conventions:
        implementation: src.evaluation.metrics
        version: prediction-metrics-v2
        headline_metric_selection: approved_2026_10_27_multabench_auc_and_r2
        headline_metric_does_not_block_metric_recording: true
        record_all_configured_metrics: true
        never_select_primary_metric_after_results: true
        undefined_metric: null_with_reason
        invalid_probabilities: reject_never_renormalize
        binary_brier: mean_squared_positive_class_probability_error_range_0_1
        multiclass_brier: mean_sum_of_squared_class_probability_errors_range_0_2
        average_precision_is_not_trapezoidal_pr_auc: true
        calibration_bins: 15
        calibration_binning: equal_width
        calibration_error: diagnostic_not_a_proper_scoring_rule
        decision_zero_division: 0
        constant_target_or_decision_mcc: null
        class_order: explicit_fixed_vocabulary
        save_reliability_bins_and_per_class_support: true
      recording:
        implementation: src.evaluation.records
        runner: src.evaluation.protocol.evaluate_cv
        save_predictions: true  # Row ID, target, full probabilities or point/quantile predictions.
        prediction_roles: [outer_test, inner_oof_binary_threshold]
        prediction_storage: project
        row_level_split_assignments_storage: project
        materialized_feature_matrices_storage: project
        full_metric_tables_storage: project
        compact_manifests_and_logs_storage: data
        save_prediction_hash: true
        required_identity: [dataset_id, data_identity, model_id, feature_set, feature_input_identity, feature_artifact_ids, estimator_settings, outer_fold, split_id, checkpoint_id, n_train, n_validation, target_scale]
        timing_stages: [inner_model_loading, inner_fit, inner_predict, threshold_selection, model_loading, fit, predict, metric_evaluation, prediction_serialization]
        fit_scope: library_fit_including_deferred_loading_and_preprocessing
        extraction_timing: separate_project_sqlite_journal_with_data_summary
        clocks: [wall_seconds, current_process_cpu_seconds]
        cuda_synchronize_before_and_after_timing: true
        record_fit_attempts_and_failures: true
        resources: [peak_rss_bytes, peak_gpu_allocated_bytes, peak_gpu_reserved_bytes]
        unavailable_resource_measurement: null_not_zero
        adapter_metadata: [package_versions, checkpoint_hash, device, hardware, thread_count, prediction_batch_size, cold_or_warm, cache_hit, effective_context_rows, n_features, feature_artifact_id, code_hash, config_hash]
        feature_creation_cost: recorded_once_separately_not_charged_to_every_cv_fold
      field_attribution:  # B4 supplement; src.evaluation.attribution. Approved 18 Nov 2026.
        # Disabled 20 Nov 2026 (Group B): permutation importance is replaced by B3 text-column
        # refits (config/B/text_column_refits.yaml); no shuffling, no SHAP.
        enabled: false
        repeats: 3  # Joint permutations per feature group and outer fold.
        max_test_rows: null  # All outer-test rows; any cap is recorded with its row subset.
        # Decision blocks and embedding groups move only among rows with the same text-availability
        # flags (approved 19 Nov 2026); `unconditional` is the original v1 scheme. Recorded per fold.
        permutation: conditional_on_availability
      preprocessing_fit_scope: training_partition_only
      model_tuning_budget: 0
      hyperparameters: pinned_library_defaults_with_explicit_seed_device_and_resource_settings
      optional_finetuning: disabled  # Native adaptation and Experiment 3 TAR are prespecified required methods.
      optional_automl_or_bagging: disabled
      native_epoch_averaging: TabSTAR_v1p1_three_internal_validation_epochs_as_published
      calibration: none
      small_n: outside_current_scope
      statistical_tests: synthesis/analysis  # Disabled until metrics/contrasts are approved before outcomes.
      comparison: jev_feature_combinations_within_the_same_model_on_identical_folds
      aggregation: per_dataset_paired_deltas_then_task_specific_across_dataset_summaries
      fold_sd_interpretation: descriptive_only_never_standard_error
      native_text_comparison: descriptive_reference_results_no_same_predictor_baseline
      model_leaderboard: outside_research_objective
      pool_raw_classification_and_regression_metrics: forbidden
      failed_or_unsupported_runs: record_explicitly_never_silently_drop
      cached_jev_features_are_fold_independent: true
      native_text_preprocessing_is_fold_specific: true
