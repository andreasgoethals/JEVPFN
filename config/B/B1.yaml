extends: B1/protocol
phase: B1
name: decision_text_feature_comparison
enabled: false
proposal: false
model_catalog: B1/models
candidate_models:
- catboost
- tabpfn_3_5
- tabicl_v2
- limix_2
- kumo_tabular
- linear
- lightgbm
roster_note: seven_predictors_library_defaults_baseline_shared_across_extractors
feature_artifacts: []
candidate_combinations:
- non_text
- non_text_plus_joint
- non_text_plus_per_column
- non_text_plus_both
include_non_text_features_in_jev: false
feature_view:
  binary_classification: positive_class_probability
  multiclass_classification: full_class_probability_vector
  regression: full_class_probability_vector
deduplicate_identical_columns_in_combined_view: true
reuse_fits_between_identical_named_arms: false
requires:
- accepted_0
- complete_feature_artifacts
- agreed_evaluation_protocol
dataset_selection:
  exclude:
  - REG_TEXT_ZOMATO_RESTAURANTS
  - MUL_TEXT_SPOTIFY_GENRES
gate_acceptance: null
candidate_extractors:
- jev
- liquid
- liquid_lfm3
- perplexity
- cloudflare
- strands
- intern
- h2o
- sii
- kev
- decision3
- nimble
- glide
- mammoth
- drex_max
- knowline
- sieve
# The membership of the first release stays fixed when a later model is registered.
initial_decision_providers: [liquid, liquid_lfm3, perplexity, cloudflare, strands, intern,
  h2o, sii, kev, decision3, nimble, glide, mammoth, drex_max, knowline, sieve]
# Each release also defines a <name>_added work list for its new open-weight or hosted providers.
# Registration defines a study scope. Inference and qualification use their own approvals.
decision_extensions:
  with_jev: {parent: open_weight, add: [jev]}
non_text_columns: all_original_numerical_and_categorical_features
# Two publications of this dataset have identical features and request bytes.
# The completed recovery job 11794789 wrote the selected revision.
dataset_feature_artifacts:
  MUL_TEXT_US_ACCIDENTS:
    nimble:
      per_column: fc29e6bbe75bafe7e7cc072aaeb684de83770298a36b4ed17d227767285d75e9
      joint: 70bf81c3b07118c7cf68934f2800eb22b5b8187637f89eb5f5fdee59157c8d57
feature_selectors:
  jev: null
  liquid: null
  liquid_lfm3: null
  perplexity: null
  cloudflare: null
  strands: null
  intern: null
  h2o: null
  sii: null
  kev: null
  decision3: null
  nimble: null
  mammoth: null
  drex_max: null
  knowline: null
  sieve: null
  glide: null

