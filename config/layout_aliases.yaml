# The ONE old -> new map of JEVPFN names (layout v4, owner-approved 26 November 2026).
# Its SHA-256 is recorded in config/structure.yaml and verified whenever the registry loads.
# Active code uses only the new names. This map is consulted for provenance only:
# locating paths recorded in earlier receipts and signed reviews, migrating existing output
# trees (`src.utils.layout_migration`) and re-keying the two re-creatable stores whose keys
# contained source hashes. Never edit an entry; append a new version instead.
schema: jevpfn.layout-aliases.v1
version: 4
created: 26-11-2026

# Internal phase IDs (keys of receipts, manifests and recipes before 26-11-2026).
# experiment_0 was 0A (before extraction) and 0B (after extraction); 0B is now B0 (predictor
# contracts and profiles), A0 (Group A pilots) and C0 (Strands training pilots).
phases:
  experiment_0: '0'
  experiment_1: B1
  experiment_2: B2
  experiment_3: B3
  experiment_4: B6
  rq1: A1
  rq2: B4
  rq3: C2
  data_efficiency: B5
  representations: C1
# Sub-trees of an old phase that now belong to another phase (old phase, path prefix).
phase_routes:
  - {phase: experiment_0, prefix: manifests/after_extraction, to: B0, as: manifests}
  - {phase: experiment_0, prefix: logs/after_extraction, to: B0, as: logs}
  - {phase: rq1, prefix: results/robustness, to: A2, as: results/robustness}
  - {phase: rq1, prefix: results/hosted_ledgers, to: A2, as: results/hosted_ledgers}
  - {phase: rq1, prefix: results/geometry_pilots, to: A0, as: results/geometry_pilots}
  - {phase: rq1, prefix: results/geometry, to: A3, as: results/geometry}
  - {phase: rq3, prefix: results/adaptation_pilots, to: C0, as: results/adaptation_pilots}

# Output paths relative to output_JEVPFN/: every folder name of layouts v1 (numbered, until
# 18-11-2026), v2 (flat, 18-23 November) and v3 (letter groups, 23-26 November). The longest
# matching prefix wins; `../archive/...` lies beside the output root.
output_prefixes:
  # v1: numbered phase folders and research-question trees.
  '0. exploration': general/1_data_and_questions
  '1. question_preparation': general/1_data_and_questions
  '2. feature_creation': general/2_feature_creation
  '3. experiment_0/manifests/after_extraction': B/B0/manifests
  '3. experiment_0/logs/after_extraction': B/B0/logs
  '3. experiment_0': general/0
  '4. experiment_1': B/B1
  '5. experiment_2': B/B2
  '6. experiment_3': B/B3
  '7. experiment_4': B/B6
  '8. synthesis': general/4_synthesis
  'rq2/4. experiment_1': B/B1
  'rq2/5. experiment_2': B/B2
  'rq2/6. experiment_3': B/B3
  'rq2/7. experiment_4': B/B6
  'rq2/8. synthesis': general/4_synthesis
  'rq2/regression_readout': B/B1/regression_readout
  regression_readout: B/B1/regression_readout
  rq1/results/outputs: A/A1/results/outputs
  rq1/results/robustness: A/A2/results/robustness
  rq1/results/hosted_ledgers: A/A2/results/hosted_ledgers
  rq1/results/geometry_pilots: A/A0/results/geometry_pilots
  rq1/results/geometry: A/A3/results/geometry
  rq1: A/A1
  rq2: B/B4
  rq3/results/adaptation_pilots: C/C0/results/adaptation_pilots
  rq3: C/C2
  # v2: flat folders.
