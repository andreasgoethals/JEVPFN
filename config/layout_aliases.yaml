# Re-keyed re-creatable stores: their keys contained the hash of source files whose phase
# literals changed. `src.utils.layout_migration --rekey` rewrites them and records both hashes.
rekey:
  pca_implementation:
    store: B/B2/results/pca/<encoder>/<dataset>.sqlite3
    sources: [src/evaluation/embedding_control.py, src/evaluation/pca_cache.py]
    old_code_identity: 7a3cb6ed6d4983baddeaeec632b03b5e253a7e7d6d2460595c26e9d26259444a
  tar_adapter_source:
    store: B/B3/results/tar/<dataset>/fold_<k>/manifest.json
    source: src/evaluation/tar.py
    old_sha256_lf: 1a475b38836a6446beeba8f27065b69618b605b6e516e92749e848a91a279911
