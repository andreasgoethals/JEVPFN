      sha256: ff9c3d2a6e91b0b181933199c230b68304c0d86fc719602aeb9e330a4bfe7e46
    - url: https://github.com/sxjscience/automl_multimodal_benchmark/blob/77edc53ef7e8a91ea4cfdaa336b353af66e3db00/multimodal_text_benchmark/scripts/data_processing/process_jigsaw.py
      evidence: The benchmark preparation defines target as the original toxicity annotation > 0.5. MulTaBench renames
