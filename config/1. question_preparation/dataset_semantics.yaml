# Source-backed meanings for the selected 18 datasets. Never rename raw data or labels.
version: dataset-semantics-v1
verified_on: '2026-10-13'
policy: Documentary definitions only; no row targets, target statistics or prediction results. Raw labels and column
  names are preserved.
datasets:
  BIN_TEXT_FAKE_JOB_POSTING:
    raw_target: fraudulent
    task_type: binary_classification
    dataset_display_name: Employment Scam Aegean job advertisements
    observation_unit: one online job advertisement
    target_display_name: job-advertisement authenticity
    target_definition: whether the job advertisement is fraudulent
    text_column_definitions:
      title: advertised job title
      salary_range: advertised salary range, as written
      description: job advertisement description
    classes:
    - value: 0
      description: legitimate job advertisement
    - value: 1
      description: fraudulent job advertisement
    sources:
    - url: https://github.com/alanarazi7/MulTaBench/blob/3bb95079a6146ed35d45187e98bcad5b063273a1/multabench/datasets/annotated/BIN_TEXT_PROFESSIONAL_FAKE_JOB_POSTING.py
      evidence: 'Pinned MulTaBench dataset annotation: task, raw fields and source lineage.'
      sha256: d626ea93acc82c50b8b8ceb15125ee768ed39310f0c97a16a076366f0daf0016
    - url: https://www.kaggle.com/datasets/shivamb/real-or-fake-fake-jobposting-prediction
      evidence: 'Original dataset card: fake versus legitimate job advertisements; fraudulent is the binary indicator.'
    review_notes: []
  BIN_TEXT_JIGSAW_TOXICITY:
    raw_target: Is Toxic
    task_type: binary_classification
    dataset_display_name: Jigsaw online comment toxicity
    observation_unit: one online comment
    target_display_name: comment toxicity
    target_definition: whether the comment is toxic
    text_column_definitions:
      comment_text: comment text
    classes:
    - value: false
