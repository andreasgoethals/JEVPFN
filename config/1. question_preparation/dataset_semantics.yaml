    - value: 1
      description: traffic-impact severity level 1, the lowest level
    - value: 2
      description: traffic-impact severity level 2 of 4
    - value: 3
      description: traffic-impact severity level 3 of 4
    - value: 4
      description: traffic-impact severity level 4, the highest level
