    - value: 0-3
      description: annual salary band 0-3 lakh Indian rupees
    - value: 10-15
      description: annual salary band 10-15 lakh Indian rupees
    - value: 15-25
      description: annual salary band 15-25 lakh Indian rupees
    - value: 25-50
      description: annual salary band 25-50 lakh Indian rupees
    - value: 3-6
      description: annual salary band 3-6 lakh Indian rupees
    - value: 6-10
