[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevpfn"
version = "0.1.0"
description = "Label-free probabilistic decision-model text features for tabular prediction"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andreas Goethals", email = "andreas.goethals@kuleuven.be" }]

# ---------------------------------------------------------------------------
# WHY 3.11-3.12 and not open-ended.
#
# The local dev environment and the VSC environment must run the SAME minor
# version, because numerics that differ between two interpreters are a
# reproducibility hazard nobody notices until a result will not replicate.
#
# Preserve the template's support boundary; JEVPFN's verified local runtime
# and proposed VSC Conda environment both use 3.12. Widen this only after
# checking the notebook and model dependency stack on both platforms.
# ---------------------------------------------------------------------------
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "pyyaml>=6.0",            # config/*.yaml — the template's config idiom
    "matplotlib>=3.8",        # src/visualize/
    "tqdm>=4.66",
    "pyarrow==25.0.1",        # Versioned, reusable feature tables (Parquet).
    "psutil>=6,<8",           # Per-fold process memory sampling.
]

[project.optional-dependencies]
# The template's health checks and the kernel used by thin notebook clients.
# Model/API packages remain optional so data inspection stays lightweight.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn==1.9.1",   # Synthetic predictor contracts and prediction metrics.
    "packaging>=24",          # Validate dependency specifications in the test suite.
]
notebooks = [
    "ipython>=8,<10",         # Rich local notebook displays.
    "ipykernel>=6.29,<8",     # Required even when dev is not installed.
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<1",      # Execute and save real notebook kernels.
    "nbformat>=5.10,<6",
]
jev = ["typesafe-sdk==0.7.2"]  # Guarded local transport; live execution is disabled by default.
models = ["tabpfn==9.0.0", "torch==2.12.1"]  # Install the hardware-specific Torch wheel first on VSC.
evaluation = ["scikit-learn==1.9.1"]  # Score saved predictions without model packages.
staging = ["huggingface-hub>=1.5,<2"]  # Explicit, separately authorized checkpoint staging.
embeddings = ["transformers==5.17.0", "torch==2.12.1", "scikit-learn==1.9.1"]
token-audit = ["transformers==5.17.0", "tokenizers==0.23.3", "jinja2==3.1.6"]  # CPU rendering, including publisher chat templates; no weights.
# Selected benchmark engines; actual VSC compatibility is tested in Experiment 0B.
# Validate each selected extra on VSC in experiment 0. AutoGluon is excluded.
baselines = ["scikit-learn==1.9.1", "catboost==1.2.10"]
tabicl = ["tabicl==2.2.0", "torch==2.12.1"]
tabstar = ["tabstar==1.1.16", "torch==2.12.1"]
limix = ["LimiX @ git+https://github.com/limix-ldm-ai/LimiX.git@516bf396333feb3198cf7aff8a6c10421f218e24"]
kumo = ["structured-data-models @ git+https://github.com/NVIDIA/structured-data-models.git@bd2d55db104679393fcd6afe13305f37e40b5467"]
contexttab = ["sap-rpt-oss @ git+https://github.com/SAP-samples/sap-rpt-1-oss.git@a0067b3c9db56bc35a6dcab09a9223a3ff0821e0"]
# Install custom decision runtimes in separate environments, never the notebook venv.
liquid = ["transformers>=5.14,<6", "torch>=2.9", "torchvision", "pillow"]
clef = ["transformers==5.17.0", "torch==2.12.1", "torchvision==0.27.1", "accelerate", "pillow", "safetensors"]
intern = ["transformers==5.17.0", "torch==2.12.1", "torchvision==0.27.1", "pillow"]
strands = ["strands-decider[cuda] @ git+https://github.com/strands-labs/strands-decider.git@b9fc83626bcca822d00f822d6c2e151b8d244ee9 ; sys_platform == 'linux'"]
# Perplexity supplies a checkpoint-specific requirements.txt; see docs/VSC.md.

[project.urls]
Repository = "https://github.com/andreasgoethals/JEVPFN"
Template = "https://github.com/andreasgoethals/0.-Template"

# ---------------------------------------------------------------------------
# Packaging: src/ is a flat package root (src/data, src/utils, src/visualize),
# NOT a src/{{PACKAGE_NAME}}/ layout, because every script and notebook imports
# `from src.utils.paths import ...`. Changing the layout breaks every import in
# the repository, so it is fixed by the template.
#
# The excludes matter: without them, `pip install -e .` walks the read-only
# literature submodule and the data directory looking for packages.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tfm-library*", "vsc-library*", "decision-models-library*", "notebooks*", "data*", "output*", "checkpoints*", "docs*", "src.data.upstream*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    # Read-only submodule. Never lint, never format, never touch.
    "tfm-library", "vsc-library", "decision-models-library",
    "src/data/upstream",
    # Generated output and notebook JSON are not source.
    "output", "output_JEVPFN",
    "notebooks",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "E501",    # line length is the formatter's job, not the linter's
    "B905",    # zip(strict=) noise in numeric code
]

[tool.ruff.lint.per-file-ignores]
# Process-lifetime counters deliberately retain a bounded question cache.
"src/jev/tokenization.py" = ["B019"]
"src/jev/decision_tokenization.py" = ["B019"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# WHY: without this, pytest walks tfm-library/ and tries to collect the upstream
# code snapshots as tests. It finds "test" in filenames there and fails on imports
# of packages this project does not have.
norecursedirs = ["tfm-library", "vsc-library", "decision-models-library", "output", "output_JEVPFN", "data", ".venv", "venv", "notebooks"]
markers = [
    "notebook: requires the local IPython/Jupyter environment; excluded from VSC CPU contracts",
    "slow: takes more than a few seconds",
    "gpu: requires CUDA; skipped on the local dev machine",
]
