# CI runs the same one command a human runs locally: scripts/check.py.
#
# WHY one command and not three separate steps: if CI ran ruff/pytest directly, CI and the
# local check could drift, and the failure a reviewer sees would not be the failure the author
# can reproduce. There is exactly one definition of "healthy".
#
# ONE WORKFLOW FILE SERVES BOTH the template repository and every project made from it. They
# differ in one way only: the template's `pyproject.toml` name is still a placeholder, so it
# is not installable — it is a template, not a package. The `_template/` directory is the
# signal, and it exists only there.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the supported range: a template that only ever builds on one interpreter
      # is a template that pins the wrong floor.
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The literature submodule is large and CI never reads it — the compliance test
          # checks that the repository DECLARES it, not that it is populated.
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install --upgrade pip

      - name: Template repository, or a project?
        id: mode
        run: |
          if [ -d _template ]; then
            echo "template=true" >> "$GITHUB_OUTPUT"
          else
            echo "template=false" >> "$GITHUB_OUTPUT"
          fi

      # --- a project -----------------------------------------------------------------
      - name: Install the project
        if: steps.mode.outputs.template == 'false'
        run: pip install -e ".[dev]"

      - name: Is this repository healthy?
        if: steps.mode.outputs.template == 'false'
        run: python scripts/check.py

      # --- the template itself -------------------------------------------------------
      # The dependency list is spelled out here rather than taken from pyproject.toml because
      # the template cannot be installed from it. Keep the two in step; `check_template.py`
      # fails loudly if an import is missing, so a drift is caught rather than guessed at.
      - name: Install the dependencies without the project
        if: steps.mode.outputs.template == 'true'
        run: pip install ruff pytest pyyaml matplotlib numpy pandas

      - name: Does this template still produce a healthy project?
        if: steps.mode.outputs.template == 'true'
        run: python _template/check_template.py
